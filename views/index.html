<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System - Login</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>Smart Parking</h1>
                <p>Park Smart, Live Easy</p>
            </div>

            <form id="loginForm" novalidate>
                <h2>Welcome Back</h2>
                <p class="subtitle">Login to your account</p>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot" title="Demo only - accounts live in this browser's LocalStorage">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary">Login</button>

                <p class="signup-link">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
                <p class="demo-hint">
                    Offline demo: data is stored in this browser only. No account yet?
                    <a href="signup.html">Create one</a> in a few seconds.
                </p>
            </form>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
