<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System - Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="signup-box">
            <div class="logo">
                <h1>Smart Parking</h1>
                <p>Join us today</p>
            </div>

            <form id="signupForm" novalidate>
                <h2>Create Account</h2>
                <p class="subtitle">Sign up to get started</p>

                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required maxlength="100" placeholder="Enter your full name" autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="100" placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required maxlength="20" placeholder="Enter your phone number" autocomplete="tel">
                </div>

                <div class="input-group">
                    <label for="vehicle">Vehicle Number</label>
                    <input type="text" id="vehicle" name="vehicle" required maxlength="50" placeholder="Enter your vehicle number">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Create a password (min 8 characters)" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Confirm your password" autocomplete="new-password">
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="terms" required> I agree to Terms &amp; Conditions
                    </label>
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>

                <p class="signup-link">
                    Already have an account? <a href="index.html">Login</a>
                </p>
                <p class="demo-hint">
                    This offline demo keeps your details in your browser's LocalStorage.
                </p>
            </form>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/signup.js"></script>
</body>
</html>
